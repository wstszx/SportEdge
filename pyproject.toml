[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-edge-scanner"
version = "0.1.0"
description = "Research-only sports prediction-market signal scanner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.36"]

[project.scripts]
sports-edge-scanner = "sports_edge_scanner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
